---
# Managed by https://github.com/dmzoneill/dmzoneill setup.sh.
# Entries follow manifests detected in this repository.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "pip"
    directories:
      - "/config/deluge/DelugeOrganise"
      - "/config/deluge/seedmage"
      - "/config/mylar3/mylar"
      - "/config/tools"
      - "/config/traktarr"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      pip:
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directories:
      - "/config/deluge"
      - "/config/tools"
      - "/config/traktarr"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      docker:
        patterns:
          - "*"
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      docker-compose:
        patterns:
          - "*"
